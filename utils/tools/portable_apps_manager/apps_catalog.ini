; Portable Apps Manager - shared app catalog (git-tracked; commit changes to share them).
; How each app is best tracked: same keys as portable_apps.ini (see config.template.ini), plus
; `add_to_path` (the Add form's suggested default) and `note`, and no install state. Used by the
; Add form ("From catalog") and written by "Save to catalog" (which keeps an entry's existing note
; and records whether the app's bin is in PATH). Comments other than this header are dropped when
; the tool saves - put explanations in `note`.

[app:adb]
source = url
url = https://dl.google.com/android/repository/platform-tools-latest-windows.zip
check_by = etag
version_from = file
version_file = source.properties:Pkg.Revision
folder = adb
bin = .
preserve = 
add_to_path = true
note = Android platform-tools, stable channel. No version in the URL; version read from source.properties in the zip.

[app:ffmpeg]
source = github
repo = GyanD/codexffmpeg
asset = ffmpeg-*-essentials_build.7z
folder = ffmpeg
bin = bin
preserve = 
add_to_path = true
note = gyan.dev release essentials build via its official GitHub mirror (tag = ffmpeg version). .7z is 35 MB vs 115 MB for the .zip; GitHub supplies a SHA-256. Needs 7-Zip. Tools are in bin/ (ffmpeg, ffplay, ffprobe).

[app:ffmpeg-git]
source = url
url = https://www.gyan.dev/ffmpeg/builds/ffmpeg-git-essentials.7z
check_by = etag
version_from = auto
version_file = 
folder = ffmpeg-git
bin = bin
preserve = 
add_to_path = true
note = gyan.dev daily git-master essentials build (ffmpeg-YYYY-MM-DD-git-<hash>-essentials_build). No dotted version, so the version shown is the build date. Needs 7-Zip and the truststore prerequisite (www.gyan.dev fails TLS without it). Tools are in bin/.

[app:Git]
source = github
repo = git-for-windows/git
asset = PortableGit-*-64-bit.7z.exe
folder = Git
bin = cmd
preserve = 
add_to_path = true
note = PortableGit 7-Zip self-extractor, unpacked with 7z.exe (7-Zip must be installed); the SFX and its post-install.bat are not run. bin = cmd (git.exe, gitk, git-gui, scalar, tig - not the bash tools) is the folder meant for PATH; auto-detect picks the root (git-bash.exe).

[app:GitExtensions]
source = github
repo = gitextensions/gitextensions
asset = GitExtensions-Portable-x64-*.zip
folder = GitExtensions
bin = .
preserve = 
add_to_path = false
note = Portable x64 zip; the asset name carries build number + commit hash after the version, the * covers both.

[app:node]
source = url
url = https://nodejs.org/dist/latest/node-latest-win-x64.zip
check_by = etag
version_from = top_folder
version_file = 
folder = node
bin = .
preserve = 
add_to_path = true
note = Follows the NEWEST Node release line (currently also LTS), not a fixed LTS line. Version from the zip top folder (node-vX.Y.Z-win-x64). ~41 MB, ~1900 files.

[app:Notepad++]
source = github
repo = notepad-plus-plus/notepad-plus-plus
asset = npp.*.portable.x64.zip
folder = Notepad++
bin = .
preserve =
add_to_path = false
note = Portable x64 zip (files at the zip root; GitHub supplies a SHA-256). The zip ships doLocalConf.xml, so settings live in the app folder, not %APPDATA%\Notepad++, and disableNppAutoUpdate.xml, so updates come only through this tool. No preserve needed: the files Notepad++ writes at run time (config.xml, session.xml, langs.xml, stylers.xml, backup/, plugins/Config ...) aren't in the zip, so the install manifest leaves them alone. Coming from an installed Notepad++: with Notepad++ closed, copy config.xml, session.xml, shortcuts.xml, contextMenu.xml, stylers.xml and plugins\Config from %APPDATA%\Notepad++ into the app folder after the first install.

[app:PortMon]
source = url
url = https://download.sysinternals.com/files/PortMon.zip
check_by = etag
version_from = auto
version_file = 
folder = PortMon
bin = .
preserve = 
add_to_path = false
note = Sysinternals Portmon. Last changed 2016-02-03, so the version shown is that date; an update is unlikely.

[app:scrcpy]
source = github
repo = Genymobile/scrcpy
asset = scrcpy-win64-*.zip
folder = scrcpy
bin = .
preserve = 
add_to_path = true
note = Android screen mirroring. Zip wraps a scrcpy-win64-vX folder (stripped).

[app:TeraTerm]
source = github
repo = TeraTermProject/teraterm
asset = teraterm-*-x64.zip
folder = TeraTerm
bin = .
preserve = TERATERM.INI
add_to_path = false
note = Tera Term 5 x64 zip (wraps teraterm-X-x64/). Ships an empty portable.ini - believed (unverified) to make it keep TERATERM.INI in the program folder; TERATERM.INI is preserved so your settings are never overwritten. Coming from 4.x: copy your old TERATERM.INI in after the first install.

