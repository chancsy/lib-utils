; Portable Apps Manager - app registry for this folder.
; Managed by utils/tools/portable_apps_manager/portable_apps_manager.py; edits made here are kept,
; but comments other than this header are dropped whenever the tool saves.
;
; [app:<name>]
;   source            = github | url
;   ; source = github
;   repo              = owner/name              ; GitHub repository
;   asset             = scrcpy-win64-*.zip      ; glob on the release asset name (case-insensitive),
;                                               ; or re:<regex>; must match exactly one asset
;   ; source = url
;   url               = https://.../app-latest.zip   ; fixed download URL (redirects are followed)
;   check_by          = final_url | etag | last_modified | download
;                       ; final_url: the redirect target names the version (e.g. .../putty/0.85/...)
;                       ; etag / last_modified: HTTP header changes mean a new file
;                       ; download: no usable header - every check downloads the file
;   version_from      = auto | file | top_folder | file_name | date   ; where the shown version comes from:
;                       ; file: version_file below; top_folder: folder wrapping the archive (node-v26.13.0-win-x64)
;                       ; file_name: downloaded file name; date: URL version or Last-Modified date
;                       ; auto: version_file if set, else top_folder, else file_name, else date
;   version_file      = source.properties:Pkg.Revision  ; file in the archive: 'path:key' for key=value files;
;                                               ; 'path' alone finds a *version*/*revision* key, or reads line 1
;   ; common
;   folder            = scrcpy                  ; fixed install folder, relative to this file
;   bin               = .                       ; subfolder for PATH (used by the PATH tool, phase 2)
;   preserve          = *.ini, data/*           ; comma-separated globs never overwritten or removed
;   installed_version = v3.3.1                  ; written by the tool (shown)
;   installed_marker  = v3.3.1                  ; written by the tool (compared by update checks)
;   installed_asset   = scrcpy-win64-v3.3.1.zip ; written by the tool
;   installed_on      = 2026-11-05              ; written by the tool

